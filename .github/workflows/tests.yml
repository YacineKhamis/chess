name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests rapides (Stockfish tourne dans Node, aucune installation)
        run: QUICK=1 node --test --test-concurrency=2 'tools/test/*.test.mjs'
